root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/server ./cmd/server"
entrypoint = ["./tmp/server"]
include_ext = ["go", "sql"]
exclude_dir = ["tmp", "vendor", ".scaffold", "harness", "realworld_spec", "security"]
delay = 200
stop_on_error = true
send_interrupt = true
kill_delay = "3s"

[log]
time = true

[misc]
clean_on_exit = true
