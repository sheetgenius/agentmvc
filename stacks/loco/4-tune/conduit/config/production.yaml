logger:
  enable: true
  level: info
  format: json
server:
  port: <%= get_env(name="PORT") %>
  binding: 0.0.0.0
  host: http://localhost
workers:
  mode: BackgroundAsync
database:
  uri: <%= get_env(name="DATABASE_URL") %>
  enable_logging: false
  connect_timeout: 5000
  idle_timeout: 600000
  min_connections: 1
  max_connections: 10
auth:
  jwt:
    secret: <%= get_env(name="SECRET_KEY_BASE") %>
    expiration: 604800
