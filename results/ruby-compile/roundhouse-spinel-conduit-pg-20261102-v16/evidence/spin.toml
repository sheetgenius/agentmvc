# spin manifest — generated by Roundhouse (spinel target).
# Dependencies go here:
#   [dependencies]
#   name = { path = "../spinel-name" }

[package]
# A program that runs for a second and exits spends no meaningful
# time in malloc. This one is a server: it allocates for every
# request for as long as it is up, and glibc's malloc/free is ~35%
# of its CPU under load. jemalloc is worth +58% on one OS worker
# and +25% on twelve, measured on this application
# (matz/spinel#4344). Rails ships jemalloc in its production image
# for the same reason.
#
# This makes libjemalloc-dev a BUILD requirement, not an optional
# speedup: spin fails the build rather than quietly producing a
# slower binary, since a build that varies silently between
# machines is a benchmark that silently compares two different
# binaries. It is the same contract the tree already has with
# libsqlite3-dev, and the README lists it beside that one. An
# older spin that predates the key ignores it and builds as
# before.
allocator = "jemalloc"

[dependencies]
# Real password hashing for has_secure_password / login —
# crypt_blowfish in carried C.
#
# The GIT form, not `bcrypt = "~> 0.1"`: that is the index
# form, and bcrypt is not in the published index
# (github.com/matz/spin-index carries pg, redis, spinel_kit).
# `spin build` on this tree failed out of the box with
# `not in the index: bcrypt` for anyone without a local
# checkout to `spin add --path`. Registration is filed as
# matz/spin-index#5 — switch this back to the version
# constraint once that merges.
#
# `ref` is a clone `--branch`, so it takes a branch or tag,
# never a commit SHA (`git clone --branch <sha>` fails with
# `Remote branch ... not found`). It names the release tag, so
# a build doesn't pick up whatever lands on `main` next.
bcrypt = { git = "https://github.com/roundhouse-rb/spinel-bcrypt", ref = "v0.1.1" }
